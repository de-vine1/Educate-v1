<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Educate Platform</title>
    <style>
        /* Base Resets */
        body {
            background-color: #f6f6f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
            font-size: 14px;
            line-height: 1.4;
            margin: 0;
            padding: 0;
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
        }

        table {
            border-collapse: separate;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
            width: 100%;
        }

        table td {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            vertical-align: top;
        }

        /* Container */
        .body {
            background-color: #f6f6f6;
            width: 100%;
        }

        .container {
            display: block;
            margin: 0 auto !important;
            max-width: 580px;
            padding: 10px;
            width: 580px;
        }

        .content {
            box-sizing: border-box;
            display: block;
            margin: 0 auto;
            max-width: 580px;
            padding: 10px;
        }

        /* Main Card */
        .main {
            background: #ffffff;
            border-radius: 8px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); /* Subtle shadow for premium feel */
        }

        .wrapper {
            box-sizing: border-box;
            padding: 30px; /* Generous padding */
        }

        .content-block {
            padding-bottom: 20px;
            padding-top: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0;
            background-color: #2c3e50; /* Educate Dark Theme */
            border-radius: 8px 8px 0 0;
            color: #ffffff;
        }
        
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Footer */
        .footer {
            clear: both;
            margin-top: 10px;
            text-align: center;
            width: 100%;
        }

        .footer td,
        .footer p,
        .footer span,
        .footer a {
            color: #999999;
            font-size: 12px;
            text-align: center;
        }

        /* Typography */
        h1, h2, h3, h4 {
            color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            line-height: 1.4;
            margin: 0;
            margin-bottom: 20px;
        }
        
        h2 { font-size: 22px; }
        p { margin: 0; margin-bottom: 15px; font-size: 15px; color: #555555; }

        /* Buttons */
        .btn {
            box-sizing: border-box;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn > tbody > tr > td {
            padding-bottom: 15px;
        }

        .btn table {
            width: auto;
        }

        .btn table td {
            background-color: #ffffff;
            border-radius: 5px;
            text-align: center;
        }

        .btn a {
            background-color: #ffffff;
            border: solid 1px #3498db;
            border-radius: 5px;
            box-sizing: border-box;
            color: #3498db;
            cursor: pointer;
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
            margin: 0;
            padding: 12px 25px;
            text-decoration: none;
            text-transform: capitalize;
        }

        .btn-primary table td {
            background-color: #3498db;
        }

        .btn-primary a {
            background-color: #3498db; /* Primary Blue */
            border-color: #3498db;
            color: #ffffff;
        }

        .btn-action {
             text-align: center;
             margin-top: 20px;
             margin-bottom: 20px;
        }

        /* Utilities */
        .align-center { text-align: center; }
        .text-muted { color: #999999; }
        .mt-20 { margin-top: 20px; }
        
        /* Links */
        a { color: #3498db; text-decoration: underline; }

        /* Responsive */
        @media only screen and (max-width: 620px) {
            table[class=body] h1 { font-size: 28px !important; margin-bottom: 10px !important; }
            table[class=body] p,
            table[class=body] ul,
            table[class=body] ol,
            table[class=body] td,
            table[class=body] span,
            table[class=body] a { font-size: 16px !important; }
            table[class=body] .wrapper,
            table[class=body] .article { padding: 10px !important; }
            table[class=body] .content { padding: 0 !important; }
            table[class=body] .container { padding: 0 !important; width: 100% !important; }
            table[class=body] .main { border-left-width: 0 !important; border-radius: 0 !important; border-right-width: 0 !important; }
            table[class=body] .btn table { width: 100% !important; }
            table[class=body] .btn a { width: 100% !important; }
            table[class=body] .img-responsive { height: auto !important; max-width: 100% !important; width: auto !important; }
        }
    </style>
</head>
<body>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" class="body">
        <tr>
            <td>&nbsp;</td>
            <td class="container">
                <div class="content">

                    <!-- START CENTERED WHITE CONTAINER -->
                    <table role="presentation" class="main">

                        <!-- HEADER -->
                        <tr>
                            <td class="header">
                                <h1>Educate</h1>
                            </td>
                        </tr>

                        <!-- START MAIN CONTENT AREA -->
                        <tr>
                            <td class="wrapper">
                                <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                                    <tr>
                                        <td>
                                            <!-- INJECTED CONTENT START -->
                                            {{content}}
                                            <!-- INJECTED CONTENT END -->
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <!-- END MAIN CONTENT AREA -->
                    </table>
                    <!-- END CENTERED WHITE CONTAINER -->

                    <!-- START FOOTER -->
                    <div class="footer">
                        <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                            <tr>
                                <td class="content-block">
                                    <span class="apple-link">Educate Platform Inc, 123 Learning Way</span>
                                    <br> Don't like these emails? <a href="#">Unsubscribe</a>.
                                </td>
                            </tr>
                            <tr>
                                <td class="content-block powered-by">
                                    &copy; {{year}} Educate Platform. All rights reserved.
                                </td>
                            </tr>
                        </table>
                    </div>
                    <!-- END FOOTER -->

                </div>
            </td>
            <td>&nbsp;</td>
        </tr>
    </table>
</body>
</html>
